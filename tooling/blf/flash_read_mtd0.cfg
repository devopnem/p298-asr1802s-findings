; =====================================================================
; Marvell / ASR SWDownloader  --  FLASH READ (upload) config
; Used by:  swdl_linux -U <this file>
;
; READ-ONLY. Talks the ASR ROM-boot USB protocol (the device enumerates as
; 2ecc:3002) and saves what comes back to Area_UploadData_SaveFile.
;
; Run:
;   doas env LC_ALL=C LANG=C ./swdl_linux -U flash_read_mtd0.cfg -T 120
;
; GRAMMAR, recovered from CUploadCfgParser::ParseUploadCfgFile
; (swdl_linux 0x081297d0-0x0812a930; section and key names from the pointer
; table at 0x8335b48-0x8335b90):
;
;   [Upload_Property]     Upload_Area_Nums, Blf_Version, PlatForm_Type,
;                         Flash_Family, Max_Upload_Size, ResetUE_AfterUpload,
;                         Reset_DelayTime
;   [Upload_Areas_List]   per-area keys are snprintf("%d_%s", n, key), i.e.
;                         <n>_Area_<Key>, 0-based below.
;
;   Area_Type              must CONTAIN "Flash"
;                          (CUploadCfgParser::FindType, find("Flash"))
;   Area_SubType           must CONTAIN "Default_Flash_Probe"
;                          (CUploadCfgParser::FindSubType)
;   Area_Partition         integer
;   Area_Offset            hex, e.g. 0x00000000
;   Area_DataSize          hex, e.g. 0x00040000
;   Area_UploadWithSpareArea   0 or 1
;   Area_UploadData_SaveFile   output filename
;
;   Blf_Version accepts only V2.0.0 / V2.1.0 / V2.2.0.
;   PlatForm_Type goes through GetFlashType, so it takes the same tokens as
;   the .blf: NAND | eMMC | SPI-NOR | SPI-NAND.
;
; TRAPS
;   * Upload_Area_Nums MUST be inside [Upload_Property]. Putting it before the
;     first section silently reads as 0 and the parser aborts with
;     "there is no upload area in UploadCfg file, please check".
;     That was the first failure here.
;   * Every ';' comment must sit before the first [Section] - same line and
;     section parser as the .blf; interleaved comments break section tracking.
;   * The binary aborts with locale::facet::_S_create_c_locale unless run
;     under LC_ALL=C LANG=C.
;   * Needs root (it talks to USB directly). Without root it exits silently
;     with no banner at all.
;
; On success the parser prints, per area:
;   Upload Area %d parameter:  + SubType / Partition / Offset / DataSize /
;   ResetUE / ResetTimeDelay, then "Upload File name is: %s" and
;   "Begin to upload data from 0x%x to 0x%x to file %s".
; =====================================================================

[Upload_Property]
Upload_Area_Nums    = 1
Blf_Version         = V2.1.0
PlatForm_Type       = SPI-NAND
Flash_Family        = SPI-NAND
Max_Upload_Size     = 0x40000
ResetUE_AfterUpload = 0
Reset_DelayTime     = 0

[Upload_Areas_List]
0_Area_Type                = Flash
0_Area_SubType             = Default_Flash_Probe
0_Area_Partition           = 0
0_Area_Offset              = 0x00000000
0_Area_DataSize            = 0x00040000
0_Area_UploadWithSpareArea = 0
0_Area_UploadData_SaveFile = mtd0.bin
