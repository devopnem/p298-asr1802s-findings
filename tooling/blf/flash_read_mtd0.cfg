; =====================================================================
; Marvell / ASR SWDownloader  --  FLASH READ (upload) config
; Used by:  swdl_linux -U <this file>
;           (equivalently the "Upload"/"Read flash" feature in the Windows
;            tools: ONTIM_Marvell_MultiDL / Marvell_SwUpgrade_C / _P)
;
; WHY THIS EXISTS
;   The write path (-D blf) is blocked: it needs the four-stage DKB
;   (OBMI / TIMH / WTMI / TZII) and WTMI+TZII are Marvell-internal blobs
;   that are not in any MTD partition.
;   The READ path needs none of that -- it just talks the ROM-boot USB
;   protocol and saves whatever comes back to a file.
;   It is strictly READ-ONLY, so it is the right first move: it tells us
;   what is actually on the chip before we risk writing anything.
;
; STATUS: structure recovered from CUploadCfgParser::ParseUploadCfgFile
;   (per-area keys are built with snprintf("%d_%s", n, key), i.e. <n>_<key>).
;   Section names are inferred -- the parser reuses the same line/section
;   reader as the blf parser. Tool feedback strings that will tell us if a
;   guess is wrong:
;       "Parsing UploadCfg file: %s"
;       "there is no upload area in UploadCfg file, please check"
;       "BLF version error, please check"
;       "Number of Area in UploadCfg file is %d"
;       "Upload Area %d parameter:" + Type/SubType/Partition/Offset/DataSize
;       "Begin to upload data from 0x%x to 0x%x to file %s"
;
; KEEP EVERY ';' COMMENT ABOVE THE FIRST [Section] -- same parser quirk as
; the blf (interleaved comments silently break section tracking).
; =====================================================================

Upload_Area_Nums = 1

[Upload_Property]
Blf_Version        = V2.1.0
PlatForm_Type      = SPI-NAND
Max_Upload_Size    = 0x40000
ResetUE_AfterUpload = 0
Reset_DelayTime    = 0

[Upload_Areas_List]
0_Area_Type                = 0
0_Area_SubType             = 0
0_Area_Partition           = 0
0_Area_Offset              = 0x00000000
0_Area_DataSize            = 0x00040000
0_Area_UploadWithSpareArea = 0
0_Area_UploadData_SaveFile = mtd0.bin
