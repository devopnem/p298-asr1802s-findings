; =====================================================================
; Marvell / ASR SWDownloader -- FLASH READ (upload) config, ALL 25 partitions
;
;   doas env LC_ALL=C LANG=C ./swdl_linux -U flash_read_all.cfg -T 600
;
; READ-ONLY. Concatenating the resulting mtd*.bin files in mtd order
; reproduces the 128 MiB linear image used by the OBM and U-Boot.
; Offsets from findings/tooling/blf/flash-map.md.
;
; GRAMMAR and TRAPS: see flash_read_mtd0.cfg. In short:
;   * Upload_Area_Nums must be INSIDE [Upload_Property]
;   * Area_Type must contain "Flash", Area_SubType "Default_Flash_Probe"
;   * keep every ';' comment above the first [Section]
;
; The per-area index below runs 0..24 in mtd order and is 0-based.
; =====================================================================

[Upload_Property]
Upload_Area_Nums    = 25
Blf_Version         = V2.1.0
PlatForm_Type       = SPI-NAND
Flash_Family        = SPI-NAND
Max_Upload_Size     = 0x8000000
ResetUE_AfterUpload = 0
Reset_DelayTime     = 0

[Upload_Areas_List]
