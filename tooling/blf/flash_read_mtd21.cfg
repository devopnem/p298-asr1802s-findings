; =====================================================================
; Marvell / ASR SWDownloader -- FLASH READ (upload) config, mtd21 ONLY
;
; READ-ONLY. Talks the ASR ROM-boot USB protocol (the device enumerates as
; 2ecc:3002) and saves what comes back. Nothing is written to flash.
;
; Run from flashing_tools/p298-swd, with the stock-whitelist binary:
;
;   sudo env LC_ALL=C LANG=C ./swdl_linux_min -U flash_read_mtd21.cfg -T 180 -N
;
; WHY THIS EXISTS
; ---------------
; After run 091 the board still printed five OBM lines and then went silent,
; and the console cannot distinguish the two possible reasons:
;
;   * the env was written, and U-Boot now stops at its prompt silently
;   * the env was not written, and U-Boot boots silently
;
; Both look identical on the serial port because the OBM sets
; "get_quiet_from_obm params->quiet: 1" before U-Boot ever runs. Reading the
; partition back is the only unambiguous answer, and it costs one boot.
;
; GRAMMAR and TRAPS: see findings/tooling/blf/flash_read_mtd0.cfg. The ones
; that bite here:
;   * Upload_Area_Nums MUST be inside [Upload_Property]
;   * every ';' comment must sit above the first [Section]
;   * needs root, and LC_ALL=C LANG=C or it aborts in locale::facet
;
; PARTITION
; ---------
; mtd21, partition number 21, linear offset 0x06000000, 0x40000 bytes --
; taken from the mtd21 entry in flash_read_all.cfg and confirmed against the
; BLF we flash with, which declares 3_Image_Partition_Number = 21 and
; 3_Image_Flash_Entry_Address = 0x06000000.
;
; The env partition is only the first 0x8000 of this; the rest is unused.
; Reading the whole partition matches flash_read_all.cfg so the output can be
; compared byte-for-byte against findings/nand-dumps/mtd21.bin.
;
; EXPECTED RESULT
; ---------------
; Compare the read-back against two known-good files:
;
;   findings/nand-dumps/mtd21.bin             stock, first 32 KB is the env
;   flashing_tools/p298-swd/mtd21.env32k.console.bin   what we tried to write
;
;   cmp -l mtd21.readback.bin mtd21.env32k.console.bin | head
;
; Identical -> the flash landed and the OBM owns the console anyway.
; Identical to stock -> nothing was written; the transfer completed but the
; board did not execute the FBF, or the write went elsewhere.
; =====================================================================

[Upload_Property]
Upload_Area_Nums    = 1
Blf_Version         = V2.1.0
PlatForm_Type       = SPI-NAND
Flash_Family        = SPI-NAND
Max_Upload_Size     = 0x40000
ResetUE_AfterUpload = 0
Reset_DelayTime     = 0

[Upload_Areas_List]
0_Area_Type                = Flash
0_Area_SubType             = Default_Flash_Probe
0_Area_Partition           = 21
0_Area_Offset              = 0x06000000
0_Area_DataSize            = 0x00040000
0_Area_UploadWithSpareArea = 0
0_Area_UploadData_SaveFile = mtd21.readback.bin