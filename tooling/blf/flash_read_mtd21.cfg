; Marvell / ASR SWDownloader 5.0.0.2 -- FLASH READ (upload) config, mtd21.
;
; READ-ONLY. Talks the ASR ROM-boot USB protocol (2ecc:3002) and saves what
; comes back to Area_UploadData_SaveFile. Nothing is written to flash.
;
;   sudo env LC_ALL=C LANG=C \
;     /home/void/Downloads/Modems/Notion_P298_ASR1802S/flashing_tools/SWDownloader_5_0_0_2/binlinux/swdl_linux \
;     -U /home/void/Downloads/Modems/Notion_P298_ASR1802S/findings/tooling/blf/flash_read_mtd21.cfg \
;     -T 180 -N
;
; Run it from flashing_tools/p298-swd so the .bin lands next to the other
; dumps. Use ABSOLUTE paths: swdl_linux resolves relative paths against
; /proc/self/exe, not the current directory.
;
; ---------------------------------------------------------------------
; THIS FILE MUST END WITH A NEWLINE
; ---------------------------------------------------------------------
; Without the final 0x0a the parser silently drops the last line, so
; Area_UploadData_SaveFile never resolves and the read-back reports
; "Upload File name is: NOT AVAILABLE" instead. Everything else about the
; config can be perfect and it still fails this way.
;
; This was mistaken twice on the way here -- first blamed on the comment
; block, then on blank lines. Both were red herrings: the configs that
; "worked" differed from the ones that did not only in having a trailing
; newline, because that is what the generating command happened to emit.
; If a future edit drops it, expect exactly this symptom.
;
; ---------------------------------------------------------------------
; FOUR DIFFERENCES FROM THE 4.8.8.2 GRAMMAR -- measured, not assumed
; ---------------------------------------------------------------------
; Found by running the parser with no board attached and reading back what it
; reports per area. The grammar in swdl_linux-internals.md describes the older
; build and is wrong for 5.0.0.2 on all four points.
;
; 1. PER-AREA KEYS ARE 1-BASED, NOT 0-BASED.
;    4.8.8.2 documented snprintf("%d_%s", n, key) with 0-based n. In 5.0.0.2
;    a 0_Area_* config parses every value as zero:
;
;      Type: 2  SubType: 255  Partition: 0  Offset: 0  DataSize: 0
;      Upload File name is: NOT AVAILABLE
;
;    With 1_Area_* the same file yields Partition: 21, Offset: 6000000,
;    DataSize: 40000. The per-area header prints "Upload Area 1", not
;    "Upload Area 0". This is the single change that makes the config work.
;
; 2. Area_Type MUST BE "SPI-NAND-FLASH", NOT "Flash".
;    Area_Type=Flash parses to Type: 0. Area_Type=SPI-NAND-FLASH parses to
;    Type: 2, the flash area type the upload path needs.
;
; 3. Blf_Version IS REQUIRED IN [Upload_Property].
;    Without it, Area_UploadData_SaveFile resolves to "NOT AVAILABLE" -- the
;    default string CBlfParser::GetBlfString returns when it has no value --
;    even though the key is right there in the file.
;
; 4. -U NO LONGER NEEDS A BLF, GIVEN THE ABOVE.
;    4.8.8.2 threw "Open blf file failed" unconditionally in this path,
;    because ParseUploadCfgFile calls CBlfParser::GetBlfString eight times and
;    a parsed BLF only exists if -D supplied one. swdl_linux refuses -D
;    together with -U ("user can't do upload and download at the same time"),
;    so in 4.8.8.2 read-back was unreachable from the command line. Once
;    Blf_Version is present the lookups resolve from the cfg and -U alone
;    parses cleanly, reaching "Prepare UpLoadDataSpecList for dump flash".
;
;    The -D/-U guard is enforced. An earlier claim here that it was dead
;    code, based on the message string having no cross-references in the
;    binary, was wrong: the string is reached by a reference form a linear
;    scan does not model.
;
; Area_SubType is still unresolved. 5.0.0.2 prints 255 (0xFF, "not found") for
; SPI-NAND-FLASH, for Flash, and for any other token tried; it prints 0 only
; for Default_Flash_Probe. Release notes 4.8.9.3 record "Fix the bug of
; FindSubType when SubType is SPI-NAND-FLASH", so this build is past that fix
; but does not accept the token we know about. Left as Default_Flash_Probe,
; the documented default in the 4.8.8.2 grammar, which parses cleanly rather
; than to an error value. If a read-back comes back wrong, vary this first.
;
; ---------------------------------------------------------------------
; PARTITION
; ---------------------------------------------------------------------
; mtd21, partition 21, linear offset 0x06000000, 0x40000 bytes. Taken from
; the mtd21 entry in flash_read_all.cfg and cross-checked against the BLF we
; write with, which declares 3_Image_Partition_Number = 21 and
; 3_Image_Flash_Entry_Address = 0x06000000.
;
; Reading the whole 0x40000 rather than just the 0x8000 env keeps the output
; directly comparable with findings/nand-dumps/mtd21.bin.
;
; EXPECTED RESULT -- three references:
;
;   findings/nand-dumps/mtd21.bin                      stock
;   flashing_tools/p298-swd/mtd21.env32k.console.bin   what we tried to write
;
;   cmp ../../findings/nand-dumps/mtd21.bin mtd21.readback.bin \
;     && echo "STOCK: the earlier write did NOT land"
;   cmp mtd21.env32k.console.bin <(head -c 32768 mtd21.readback.bin) \
;     && echo "PATCH: it landed"
;   cmp -l mtd21.env32k.console.bin <(head -c 32768 mtd21.readback.bin) | wc -l

[Upload_Property]
Upload_Area_Nums    = 1
Blf_Version         = V2.1.0
PlatForm_Type       = SPI-NAND
Flash_Family        = SPI-NAND
Max_Upload_Size     = 0x40000
ResetUE_AfterUpload = 0
Reset_DelayTime     = 0

[Upload_Areas_List]
1_Area_Type                = SPI-NAND-FLASH
1_Area_SubType             = Default_Flash_Probe
1_Area_Partition           = 21
1_Area_Offset              = 0x06000000
1_Area_DataSize            = 0x00040000
1_Area_UploadWithSpareArea = 0
1_Area_UploadData_SaveFile = mtd21.readback.bin
